name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy scikit-learn xgboost statsmodels matplotlib joblib pyarrow pytest
      - run: python -m pytest -q   # synthetic data only, no PhysioNet access needed
